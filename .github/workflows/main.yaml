name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * *'  # This runs the workflow every day at midnight UTC

jobs:
  build_tw_iso:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{matrix.os}}

    container:
      image: 'ghcr.io/void-linux/void-mklive:20250116R1'
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: '/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin'

    steps:
      - name: Prepare container
        shell: sh
        run: xbps-install -Syu xbps && xbps-install -yu
      - name: Clone and checkout
        uses: classabbyamp/treeless-checkout-action@v1
      - run: ./mktw.sh
      - uses: oras-project/setup-oras@v2
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | oras login --username "${{ secrets.REGISTRY_USERNAME }}" --password-stdin docker.io
      - name: Delete old one
        run: |
          oras manifest delete --force docker.io/tw4452852/void-mklive:latest
      - name: Push new one
        run: |
          oras push docker.io/tw4452852/void-mklive:latest $(ls -t *.iso | head -n 1)
